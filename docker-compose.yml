name: jekyll-ui-redesign
services:
  site:
    build: .
    ports:
      - "${SITE_PORT:-14000}:4000"
    healthcheck:
      test: ["CMD","ruby","-rnet/http","-e","exit(Net::HTTP.get_response(URI('http://127.0.0.1:4000/')).code == '200' ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
