name: Build and validate Jekyll site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Validate HTML
        uses: anishathalye/proof-html@v2
        with:
          directory: ./_site
          # External links point at LinkedIn, Gemini and Base44, which rate-limit
          # or block CI runners. Internal links and HTML are still validated.
          disable_external: true
