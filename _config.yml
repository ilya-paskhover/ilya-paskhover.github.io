# Site settings
title: Ilya Paskhover
tagline: Principal software architect
description: > # this means to ignore newlines until "baseurl:"
  Blog and projects by Ilya Paskhover, principal software architect with 16+ years
  of experience. Posts about AI agents, industrial IoT and side projects.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://ilya-paskhover.github.io" # the base hostname & protocol for your site
github_username: ilya-paskhover
author: Ilya Paskhover
lang: en

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

social:
  name: Ilya Paskhover
  links:
    - https://www.linkedin.com/in/ilyapaskhover/
    - https://github.com/ilya-paskhover

# Build settings
markdown: kramdown
kramdown:
  auto_ids: true
  toc_levels: "2"

host: localhost
port: 4000


exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - Dockerfile
  - docker-compose.yml
  - docs
  - test
  - vendor
  - node_modules
  - .poc-artifacts

defaults:
  - scope:
      path: "googlec97749bedfe403e3.html"
    values:
      sitemap: false
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Ilya Paskhover
