<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EFE0C6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C2739" media="(prefers-color-scheme: dark)">
<meta name="description" content="Shallow Whale, a simulated crypto trading game. No ads, no purchases, no real money.">
<title>Shallow Whale</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Saira";src:url("fonts/Saira-VF.ttf") format("truetype");font-weight:100 900;font-stretch:50% 125%;font-display:swap}
@font-face{font-family:"Saira Stencil One";src:url("fonts/SairaStencilOne-Regular.ttf") format("truetype");font-display:swap}
</style>
<style>
/* ==========================================================================
   Shallow Whale: the station's trading terminal.
   Palette sampled from the reference: navy leads, tan hull plastic, slate
   metal, deep space, and orange only as a signal light.
   Rules: ink outlines define objects. Only pressable things cast a hard
   shadow and press down. Screens are CRTs, and only screens are CRTs.
   ========================================================================== */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --wall:#D8BE98; --plate:#EFE0C6; --recess:#E3CCA8;
  --edge:#2A1F1A; --seam:rgba(42,31,26,.2);
  --text:#2A1F1A; --muted:#54453A; --faint:#6F5C4B;
  --navy:#1F415E; --on-navy:#EFE0C6;
  --slate:#51525A; --bolt:#A2A3A8; --signal:#E26C11;
  --up:#1B6E45; --on-up:#EFE0C6; --down:#A8321C; --on-down:#EFE0C6;
  --chip:#E3CCA8; --hard:#2A1F1A;
  --space:#0B1426; --earth:#3566B8;
  --crt:#0F2A4D; --crt-grid:rgba(158,216,255,.13); --crt-text:#9ED8FF; --crt-up:#7BE8B8; --crt-down:#FF9A84;
  --hull:
    repeating-linear-gradient(0deg, transparent 0 139px, rgba(42,31,26,.08) 139px 141px),
    repeating-linear-gradient(90deg, transparent 0 187px, rgba(42,31,26,.08) 187px 189px);
  --hull-size:auto;
  --tab-h:62px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall:#0B1426; --plate:#1C2739; --recess:#152033;
    --edge:#56627C; --seam:rgba(239,224,198,.11);
    --text:#EFE0C6; --muted:#BDB4A6; --faint:#9C958B;
    --navy:#2F5F95; --on-navy:#EFE0C6;
    --slate:#6B6E78; --bolt:#B4B6BD; --signal:#F0883A;
    --up:#6FD9A8; --on-up:#0B1426; --down:#FF8C76; --on-down:#0B1426;
    --chip:#243149; --hard:#03060D;
    --space:#060B17; --earth:#3A6CC4;
    --hull:
      radial-gradient(1.3px 1.3px at 12% 18%, rgba(239,224,198,.8), transparent 70%),
      radial-gradient(1px 1px at 38% 62%, rgba(239,224,198,.55), transparent 70%),
      radial-gradient(1.5px 1.5px at 71% 27%, rgba(158,216,255,.75), transparent 70%),
      radial-gradient(1px 1px at 86% 74%, rgba(239,224,198,.5), transparent 70%),
      radial-gradient(1px 1px at 55% 91%, rgba(239,224,198,.45), transparent 70%),
      radial-gradient(1.2px 1.2px at 24% 83%, rgba(158,216,255,.5), transparent 70%);
    --hull-size:260px 260px;
  }
}
:root[data-theme="dark"]{
  --wall:#0B1426; --plate:#1C2739; --recess:#152033;
  --edge:#56627C; --seam:rgba(239,224,198,.11);
  --text:#EFE0C6; --muted:#BDB4A6; --faint:#9C958B;
  --navy:#2F5F95; --on-navy:#EFE0C6;
  --slate:#6B6E78; --bolt:#B4B6BD; --signal:#F0883A;
  --up:#6FD9A8; --on-up:#0B1426; --down:#FF8C76; --on-down:#0B1426;
  --chip:#243149; --hard:#03060D;
  --space:#060B17; --earth:#3A6CC4;
  --hull:
    radial-gradient(1.3px 1.3px at 12% 18%, rgba(239,224,198,.8), transparent 70%),
    radial-gradient(1px 1px at 38% 62%, rgba(239,224,198,.55), transparent 70%),
    radial-gradient(1.5px 1.5px at 71% 27%, rgba(158,216,255,.75), transparent 70%),
    radial-gradient(1px 1px at 86% 74%, rgba(239,224,198,.5), transparent 70%),
    radial-gradient(1px 1px at 55% 91%, rgba(239,224,198,.45), transparent 70%),
    radial-gradient(1.2px 1.2px at 24% 83%, rgba(158,216,255,.5), transparent 70%);
  --hull-size:260px 260px;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}   /* author display rules otherwise beat the hidden attribute */
html{height:100%;scrollbar-gutter:stable;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background-color:var(--wall);background-image:var(--hull);background-size:var(--hull-size);
  color:var(--text);
  font-family:"Saira","Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;font-stretch:100%;
  font-variant-numeric:tabular-nums;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}

/* ---------- console header ---------- */
#app{display:flex;flex-direction:column;min-height:100%;max-width:720px;margin:0 auto}
header#top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:10px 14px 11px;background:var(--plate);border-bottom:2px solid var(--edge);
}
.porthole{width:64px;height:64px;flex:none;display:block}
.ph-ring{fill:var(--slate);stroke:var(--edge);stroke-width:2}
.ph-glass{fill:var(--space)}
.ph-edge{fill:none;stroke:var(--edge);stroke-width:2}
.ph-star{fill:#EFE0C6}
.ph-glare{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;opacity:.3}
.ph-bolt{fill:var(--bolt);stroke:var(--edge);stroke-width:.8}
.deck{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ident{display:flex;align-items:center;gap:9px;min-width:0}
.wordmark{font-family:"Saira Stencil One","Saira",sans-serif;font-size:19px;line-height:1;white-space:nowrap}
.status{display:flex;align-items:center;gap:5px;min-width:0;font-size:11.5px;font-weight:600;font-stretch:85%;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--slate);border:1.5px solid var(--edge)}
.status i.live{background:var(--up);box-shadow:0 0 6px var(--up)}
.iconbtn{margin-left:auto;width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;color:var(--text);
  background:var(--recess);border:2px solid var(--edge);box-shadow:0 2px 0 var(--hard);transition:transform .06s,box-shadow .06s}
.iconbtn svg{width:18px;height:18px}
.iconbtn:active{transform:translateY(2px);box-shadow:0 0 0 var(--hard)}

.readout{
  position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;column-gap:10px;
  padding:4px 10px 5px;background:var(--crt);border:2px solid var(--edge);border-radius:7px;
}
.readout::after,.crt::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px);
  box-shadow:inset 0 0 16px rgba(0,0,0,.55);
}
.nw-label{display:block;font-size:10.5px;line-height:1.2;font-weight:600;font-stretch:85%;color:rgba(158,216,255,.72)}
.nw-num{font-size:clamp(19px,6.4vw,25px);font-weight:700;line-height:1.08;color:var(--crt-text);text-shadow:0 0 8px rgba(158,216,255,.45)}
.nw-chg{font-size:12.5px;font-weight:700;font-stretch:88%;padding-bottom:3px;white-space:nowrap}
.readout .up{color:var(--crt-up)} .readout .down{color:var(--crt-down)} .readout .flat{color:rgba(158,216,255,.6)}
@media (max-width:380px){
  header#top{gap:10px;padding:9px 12px 10px}
  .porthole{width:54px;height:54px}
  .wordmark{font-size:16px}
  .status{font-size:10.5px;gap:4px}
  .iconbtn{width:32px;height:32px}
}

main{flex:1;padding:14px 14px calc(var(--tab-h) + 28px)}
h2.sec{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;font-stretch:85%;color:var(--text);margin:22px 0 8px}
h2.sec::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--seam)}
h2.sec:first-child{margin-top:4px}

/* ---------- console strip tabs ---------- */
nav#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  max-width:720px;margin:0 auto;padding:0 6px env(safe-area-inset-bottom,0px);background:var(--plate);
  border:2px solid var(--edge);border-bottom:0;border-radius:18px 18px 0 0;
}
nav#tabs button{position:relative;flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--faint);font-size:12px;font-weight:650;font-stretch:88%}
nav#tabs button i{display:block;line-height:0}
nav#tabs button svg{width:24px;height:24px}
nav#tabs .ko{stroke:var(--plate)}
nav#tabs .kof{fill:var(--plate);stroke:none}
nav#tabs button[aria-current="page"]{color:var(--navy)}
nav#tabs button[aria-current="page"]::before{content:"";position:absolute;top:-2px;left:26%;right:26%;height:4px;border-radius:0 0 4px 4px;background:var(--navy)}
nav#tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;
  background:var(--signal);border:1.5px solid var(--edge);box-shadow:0 0 6px var(--signal)}
/* count badge: how many quest rewards are ready. Plate, not orange: orange is for signal lights */
nav#tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--plate);border:1.5px solid var(--edge);color:var(--navy);
  font-size:11px;font-weight:750;line-height:15px;font-variant-numeric:tabular-nums;text-align:center}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) nav#tabs .badge{color:#8FB8E6} }
:root[data-theme="dark"] nav#tabs .badge{color:#8FB8E6}
/* action pill docked above the bar: shows only when there is something to do */
#action{position:fixed;left:50%;bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:29;
  background:var(--navy);color:var(--on-navy);border:2px solid var(--edge);box-shadow:0 3px 0 var(--hard);
  padding:10px 20px;border-radius:9px;font-size:14px;font-weight:700;font-stretch:92%;white-space:nowrap;transition:transform .06s,box-shadow .06s;
  animation:pill-in .2s cubic-bezier(.2,.8,.2,1)}
#action:active{transform:translate(-50%,3px);box-shadow:0 0 0 var(--hard)}
@keyframes pill-in{from{opacity:0;transform:translate(-50%,10px)}}
@media (prefers-reduced-motion:reduce){ #action{animation:none} }
body.has-action main{padding-bottom:calc(var(--tab-h) + 76px)}
body.has-action #toast{bottom:calc(var(--tab-h) + 70px + env(safe-area-inset-bottom,0px))}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) nav#tabs button[aria-current="page"]{color:#8FB8E6} :root:not([data-theme="light"]) nav#tabs button[aria-current="page"]::before{background:#8FB8E6} }
:root[data-theme="dark"] nav#tabs button[aria-current="page"]{color:#8FB8E6}
:root[data-theme="dark"] nav#tabs button[aria-current="page"]::before{background:#8FB8E6}

/* ---------- panels and rows ---------- */
.card{background:var(--plate);border:2px solid var(--edge);border-radius:10px}
.list{background:var(--plate);border:2px solid var(--edge);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;width:100%;text-align:left;border-bottom:1.5px solid var(--seam)}
.row:last-child{border-bottom:0}
button.row:active{background:var(--recess)}
.coin{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none;
  font-size:11px;font-weight:700;font-stretch:85%;color:#1A1410;border:2px solid var(--edge)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15px;font-weight:650;line-height:1.25}
.nm b.who{display:flex;align-items:center;gap:7px}
.nm .gl{width:18px;height:18px;flex:none;color:var(--muted)}
.nm small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* a trade row wraps: its day and exit rule are what tell two trades in one coin apart */
.row.lot .nm small{white-space:normal;line-height:1.35}
.val{text-align:right;flex:none;border-radius:6px;padding:2px 5px;margin-right:-5px}
.val b{display:block;font-size:15px;font-weight:650;line-height:1.25}
.val b.up,.val b.down,.val b.flat{font-size:11.5px;font-weight:700;font-stretch:88%;max-width:82px;white-space:normal;text-align:right}
.val small{display:block;font-size:12px;font-weight:650}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--faint)}
.spark{flex:none;width:52px;height:22px;overflow:visible}
.flash-up{animation:fu .55s ease-out} .flash-down{animation:fd .55s ease-out}
@keyframes fu{from{background:color-mix(in srgb,var(--up) 22%,transparent)}to{background:transparent}}
@keyframes fd{from{background:color-mix(in srgb,var(--down) 22%,transparent)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash-up,.flash-down{animation:none}}

.pill{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--recess);border:1.5px solid var(--edge);font-size:11.5px;font-weight:700;font-stretch:88%}

/* pressable: ink outline, hard shadow, and it goes down when you press it */
.btn{display:block;width:100%;padding:12px;border-radius:9px;
  background:var(--navy);color:var(--on-navy);border:2px solid var(--edge);box-shadow:0 3px 0 var(--hard);
  font-weight:700;font-size:15.5px;font-stretch:92%;text-align:center;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--hard)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--plate);color:var(--text)}
.btn.danger,.btn.sell{background:var(--down);color:var(--on-down)}
.btn.buy{background:var(--up);color:var(--on-up)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1.5px solid var(--seam)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:650}
.empty{padding:24px 18px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px;font-weight:650}

.alloc{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--recess);border:2px solid var(--edge);margin:10px 0 4px}
.alloc i{display:block;height:100%;border-right:1.5px solid var(--edge)}
.alloc i:last-child{border-right:0}

.bar{height:10px;border-radius:999px;background:var(--recess);border:1.5px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);transition:width .3s ease}

/* ---------- quests ---------- */
.quest{padding:13px 12px;border-bottom:1.5px solid var(--seam)}
.quest:last-child{border-bottom:0}
.quest .qh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.quest b{font-size:15px;font-weight:650}
.quest .rw{font-size:12px;font-weight:700;font-stretch:88%;color:var(--navy);white-space:nowrap;text-align:right}
.quest .qm{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin:8px 0 5px}
.claim{margin-top:11px;padding:9px;border-radius:9px;width:100%;font-weight:700;font-size:14px;font-stretch:92%;
  background:var(--navy);color:var(--on-navy);border:2px solid var(--edge);box-shadow:0 3px 0 var(--hard);transition:transform .06s,box-shadow .06s}
.claim:active{transform:translateY(3px);box-shadow:0 0 0 var(--hard)}
.swaprow{display:flex;justify-content:flex-end;margin-top:9px}
.swap{padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:700;font-stretch:92%;color:var(--text);
  background:var(--recess);border:1.5px solid var(--edge);box-shadow:0 2px 0 var(--hard);transition:transform .06s,box-shadow .06s}
.swap:active{transform:translateY(2px);box-shadow:0 0 0 var(--hard)}
.swap.armed{background:var(--navy);color:var(--on-navy)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .quest .rw{color:#8FB8E6} }
:root[data-theme="dark"] .quest .rw{color:#8FB8E6}

/* ---------- shop ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.item{background:var(--plate);border:2px solid var(--edge);border-radius:10px;padding:10px 8px 9px;text-align:center;
  box-shadow:0 3px 0 var(--hard);transition:transform .06s,box-shadow .06s}
.item:active{transform:translateY(3px);box-shadow:0 0 0 var(--hard)}
.item .ic{display:block;width:30px;height:30px;margin:2px auto 3px;color:var(--text)}
.item .ic svg,.trophycase svg,.nm .gl svg{display:block;width:100%;height:100%}
.item b{display:block;font-size:13px;font-weight:650;margin-top:2px}
.item small{display:block;font-size:12px;font-weight:700;margin-top:3px;color:var(--navy)}
.item.owned{background:var(--recess);box-shadow:none;transform:none}
.item.owned small{color:var(--up)}
.item.locked{opacity:.55;box-shadow:none}
.item.locked small{color:var(--faint)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .item small{color:#8FB8E6} }
:root[data-theme="dark"] .item small{color:#8FB8E6}
.trophycase{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.trophycase span{width:36px;height:36px;border-radius:8px;background:var(--recess);display:grid;place-items:center;border:2px solid var(--edge);color:var(--text)}
.trophycase .gl{width:22px;height:22px}

/* ---------- news ---------- */
.news{padding:11px 12px;border-bottom:1.5px solid var(--seam);font-size:13.5px}
.news:last-child{border-bottom:0}
.news em{font-style:normal;font-weight:700;font-size:11.5px;font-stretch:88%;color:var(--faint);display:block;margin-bottom:2px}

/* price source line */
.srcline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:9px 2px 0;font-weight:600;font-stretch:92%}
.srcline i{width:8px;height:8px;border-radius:50%;background:var(--slate);border:1.5px solid var(--edge);flex:none}
.srcline i.live{background:var(--up);box-shadow:0 0 6px var(--up)} .srcline i.bad{background:var(--signal);box-shadow:0 0 6px var(--signal)}

.attrib{display:inline-block;margin:6px 2px 0;font-size:12px;font-weight:650;color:var(--muted);text-decoration:underline;text-underline-offset:2px}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(6,11,23,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:720px;margin:0 auto;
  background:var(--plate);border:2px solid var(--edge);border-bottom:0;border-radius:18px 18px 0 0;
  max-height:92%;overflow-y:auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));
}
#sheet.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
.grab{width:44px;height:6px;border-radius:999px;background:var(--slate);border:1.5px solid var(--edge);margin:9px auto 4px}
.sheeth{display:flex;align-items:center;gap:11px;padding:6px 0 12px;position:sticky;top:0;background:var(--plate);z-index:2}
.seg{display:flex;background:var(--recess);border:2px solid var(--edge);border-radius:11px;padding:3px;margin:12px 0}
.seg button{flex:1;padding:8px;border-radius:8px;font-weight:700;font-size:14.5px;font-stretch:92%;color:var(--muted);border:2px solid transparent}
.seg button[aria-pressed="true"]{background:var(--plate);color:var(--text);border-color:var(--edge);box-shadow:0 2px 0 var(--hard)}
.amt{display:flex;align-items:center;gap:8px;border:2px solid var(--edge);border-radius:10px;padding:10px 13px;background:var(--recess)}
.amt span{color:var(--faint);font-size:20px;font-weight:650}
.amt input{flex:1;min-width:0;border:0;background:none;font-size:25px;font-weight:700;outline:none}
.chips{display:flex;gap:7px;margin:10px 0 12px}
.chips button{flex:1;padding:7px 0;border-radius:8px;background:var(--plate);border:2px solid var(--edge);box-shadow:0 2px 0 var(--hard);
  font-size:13px;font-weight:700;font-stretch:90%;transition:transform .06s,box-shadow .06s}
.chips button:active{transform:translateY(2px);box-shadow:0 0 0 var(--hard)}

  {n:"Sideways Sam",  g:"sideways", style:"scalp",  skill: 0.000005},
  {n:"DCA Dmitri",    g:"calendar", style:"dca",    skill: 0.000060},
  {n:"Contrarian Coy",g:"contra",   style:"contra", skill: 0.000035},
  {n:"Rugpull Rick",  g:"rug",      style:"panic",  skill:-0.000110},
  {n:"Quiet Quinn",   g:"cube",     style:"dca",    skill: 0.000030}
];
/* Rivals are looked up by name, so saves never carry the icon itself. */
function botGlyph(name){
  var d=BOT_DEFS.filter(function(b){ return b.n===name; })[0];
  return d ? d.g : "you";
}

/* Live prices move at real speed, while the simulator packs a game day into
   four minutes. A target sized for the simulator ("grow net worth 30%", "close
   at a 10% gain") can take weeks against the real market, so each quest is
   sized for the mode it was drawn in. `live` holds the live-mode scale. */
var QUEST_LOG_MAX = 20;   /* completed quests kept for the history list */
/* `market` quests can only finish when prices move. In live mode that is the
   real market, which can take hours, while the others finish as fast as you
   trade. Finished quests get replaced and slow ones stay, so without a cap a
   live board drifts to all market quests and nothing is left to do. */
var LIVE_MARKET_CAP = 2;
/* `day` quests (winner, profit) need a real move of a few percent: with live
   prices that takes hours, often a day. Allow one at a time, so the board
   always has room for quests a session can finish */
var LIVE_DAY_CAP = 1;
/* live-mode sizing in one place, so tools/verify-quests.js can sweep it.
   Rewards are a share of net worth times (1 + random), floored at
   rewardFloor; quick are trades, volume and spread, market the rest.
   profitScale multiplies the profit quest's `live` shares; winnerPct is the
   gain a winner needs. */
var LIVE_TUNE = {quickReward:0.005, marketReward:0.01, rewardFloor:10, profitScale:1, winnerPct:2};
var QUEST_POOL = [
  {t:"trades",  n:"Trades", vals:[3,5,8,12],
   txt:function(x){ return "Place "+x+" trades"; }},
  {t:"volume",  n:"Volume", vals:[1500,5000,15000,40000], money:true,
   txt:function(x){ return "Trade "+money(x)+" in total volume"; }},
  {t:"profit",  n:"Profit from winning sales", market:true, day:true, vals:[150,500,1500,5000], money:true, live:[0.01,0.02,0.03,0.05],   /* share of net worth */
   txt:function(x){ return "Bank "+money(x)+" in profit from winning sales"; }},
  {t:"nw",      n:"Net worth", market:true, vals:[4000,7000,15000,40000], money:true, abs:true, live:[0.02,0.03,0.05,0.08],
   txt:function(x){ return "Grow net worth to "+money(x); }},
  {t:"spread",  n:"Coins held", vals:[2,3,4,5], abs:true,
   txt:function(x){ return "Hold "+x+" different coins at once"; }},
  {t:"dip",     n:"Buy the dip", market:true, vals:[1,2,3,4], own:true, pct:{sim:3, live:1},
   txt:function(x,p){ return x===1 ? "Buy a coin that is down "+p+"% or more today"
                                   : "Buy coins that are down "+p+"% or more today, "+x+" times"; }},
  {t:"winner",  n:"Sell a winner", market:true, day:true, vals:[1,2,3,4], own:true, pct:{sim:10},   /* live: LIVE_TUNE.winnerPct */
   txt:function(x,p){ return x===1 ? "Sell a position at a "+p+"% gain or better"
                                   : "Sell "+x+" positions at a "+p+"% gain or better"; }}
];
var QUEST_DEF = {};
QUEST_POOL.forEach(function(d){ QUEST_DEF[d.t]=d; });
function isMarketQuest(q){ return !!(QUEST_DEF[q.t] && QUEST_DEF[q.t].market); }
function isDayQuest(q){ return !!(QUEST_DEF[q.t] && QUEST_DEF[q.t].day); }

/* ============================ price feed ============================ */
/* Live prices are the default. The feed supplies an anchor price every few
   seconds and the simulator's walk converges on it, so the chart keeps moving
   between polls; when the feed is unreachable the simulator simply carries on.
   Live mode needs a build that can reach the network: the Capacitor app with
   CapacitorHttp enabled, or your own hosting. It cannot work inside a
   published Claude artifact, where outbound requests are blocked. */
var FEED_MAP = {
  BTC: {binance:"BTCUSDT",  gecko:"bitcoin"},
  ETH: {binance:"ETHUSDT",  gecko:"ethereum"},
  SOL: {binance:"SOLUSDT",  gecko:"solana"},
  XRP: {binance:"XRPUSDT",  gecko:"ripple"},
  DOGE:{binance:"DOGEUSDT", gecko:"dogecoin"},
  TON: {binance:"TONUSDT",  gecko:"the-open-network"},
  BCH: {binance:"BCHUSDT",  gecko:"bitcoin-cash"}
};

var Feed = {
  mode:"live",           /* "live" | "sim"; live by default, the simulator covers any outage */
  provider:"binance",    /* "binance" | "gecko" */
  pollMs:15000,
  anchors:{},            /* sym -> {p, chg} */
  status:"off",          /* off | wait | ok | error */
  note:"",
  at:0,
  snapped:false,
  timer:null,

  load:function(){
    try{
      var o=JSON.parse(localStorage.getItem("pw.feed")||"{}");
      if(o.mode==="sim") this.mode="sim";
      if(o.provider==="gecko"||o.provider==="binance") this.provider=o.provider;
    }catch(e){}
  },
  persist:function(){
    try{ localStorage.setItem("pw.feed", JSON.stringify({mode:this.mode, provider:this.provider})); }catch(e){}
  },
  set:function(mode, provider){
    var switched = mode!==this.mode;
    this.mode=mode; if(provider) this.provider=provider;
    this.fellBack=false;
    /* quests were sized for the other mode: redraw the unfinished ones */
    if(switched && S){ refreshQuests(S, true); save(); render(); }
    this.anchors={}; this.snapped=false;
    this.status = mode==="live" ? "wait" : "off";
    this.note="";
    this.persist(); this.start(); paint({});
  },
  start:function(){
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.mode!=="live") return;
    var self=this;
    this.poll();
    this.timer=setInterval(function(){ self.poll(); }, this.pollMs);
  },
  stop:function(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },

  url:function(){
    var syms=COINS.map(function(c){ return FEED_MAP[c.s]; }).filter(Boolean);
    if(this.provider==="gecko"){
      return "https://api.coingecko.com/api/v3/simple/price?ids="+
             syms.map(function(x){ return x.gecko; }).join(",")+
             "&vs_currencies=usd&include_24hr_change=true";
    }
    /* data-api.binance.vision is Binance's host for public market data only:
       same ticker, no account endpoints behind it */
    return "https://data-api.binance.vision/api/v3/ticker/24hr?symbols="+
           encodeURIComponent(JSON.stringify(syms.map(function(x){ return x.binance; })));
  },

  parse:function(json){
    var out={}, i, c;
    if(this.provider==="gecko"){
      for(i=0;i<COINS.length;i++){
        c=COINS[i]; var row=json[FEED_MAP[c.s].gecko];
        if(row && typeof row.usd==="number" && row.usd>0){
          out[c.s]={p:row.usd, chg:(typeof row.usd_24h_change==="number"?row.usd_24h_change:null)};
        }
      }
    }else{
      if(!Array.isArray(json)) return out;
      var by={}; json.forEach(function(r){ if(r&&r.symbol) by[r.symbol]=r; });
      for(i=0;i<COINS.length;i++){
        c=COINS[i]; var r2=by[FEED_MAP[c.s].binance];
        if(!r2) continue;
        var pz=parseFloat(r2.lastPrice), ch=parseFloat(r2.priceChangePercent);
        if(isFinite(pz)&&pz>0) out[c.s]={p:pz, chg:isFinite(ch)?ch:null};
      }
    }
    return out;
  },

  poll:function(){
    if(this.mode!=="live") return;
    if(typeof fetch!=="function"){ this.status="error"; this.note="no network access"; return; }
    var self=this;
    var ctl = (typeof AbortController==="function") ? new AbortController() : null;
    var kill = setTimeout(function(){ if(ctl) ctl.abort(); }, 8000);
    fetch(this.url(), ctl?{signal:ctl.signal}:{})
      .then(function(r){
        if(!r.ok) throw new Error("HTTP "+r.status);
        return r.json();
      })
      .then(function(j){
        clearTimeout(kill);
        var got=self.parse(j);
        if(!Object.keys(got).length) throw new Error("no prices in the response");
        self.anchors=got; self.status="ok"; self.note=""; self.at=Date.now();
        if(!self.snapped){ self.snap(); self.snapped=true; }
        paint({});
      })
      .catch(function(e){
        clearTimeout(kill);
        /* Binance refuses some regions (unconfirmed which), so on a first-poll
           failure try CoinGecko once before giving up on live prices */
        if(!self.snapped && !self.fellBack && self.provider==="binance"){
          self.fellBack=true; self.provider="gecko"; self.persist(); self.poll(); return;
        }
        self.status="error";
        self.note=(e&&e.name==="AbortError") ? "the request timed out" : (e&&e.message)||"request blocked";
        paint({});
      });
  },

  /* First good poll: jump the book to the real prices instead of drifting in. */
  snap:function(){
    COINS.forEach(function(c){
      var a=Feed.anchors[c.s]; if(!a) return;
      var k=a.p/S.prices[c.s];
      if(!isFinite(k) || k<=0) return;
      S.prices[c.s]=a.p;
      var hh=S.hist[c.s];
      for(var i=0;i<hh.length;i++) hh[i]=hh[i]*k;
      S.dayRef[c.s]=hh[Math.max(0,hh.length-TICKS_PER_DAY)];
      /* the position was paid for in simulated dollars: rescale its basis and
         exit rules by the same factor so the jump does not invent a profit */
      S.lots.forEach(function(l){
        if(l.s!==c.s) return;
        l.p*=k; if(l.sl) l.sl*=k; if(l.tp) l.tp*=k;
      });
    });
    save();
  },

  label:function(){
    if(this.mode!=="live") return "Simulated market";
    var name = this.provider==="gecko" ? "CoinGecko" : "Binance";
    if(this.status==="ok"){
      var secs=Math.max(0,Math.round((Date.now()-this.at)/1000));
      return "Live from "+name+", updated "+secs+"s ago";
    }
    if(this.status==="wait") return "Connecting to "+name;
    return "Live feed unavailable ("+this.note+"). Running on the simulator.";
  },
  dot:function(){
    if(this.mode!=="live") return "";
    return this.status==="ok" ? "live" : (this.status==="error" ? "bad" : "");
  }
};

   and the Android app (the store listing links the same URL). */
var PRIVACY_URL = "https://ilya-paskhover.github.io/shallow-whale/privacy.html";
var SAVE_KEY = "pw.save.v1";
var S = null;
var refs = {};
var tab = "market";

function defaultBots(prices){
  return BOT_DEFS.map(function(b){
    var o={n:b.n,style:b.style,skill:b.skill,cash:0,h:{}};
    var worth = 1800*Math.pow(12, Math.random());   /* 1.8k to ~21k, a ladder to climb */
    var n = 2+Math.floor(Math.random()*4);
    var picks = COINS.slice().sort(function(){ return Math.random()-0.5; }).slice(0,n);
    var invest = worth*(0.5+Math.random()*0.45);
    o.cash = worth-invest;
    picks.forEach(function(c){ o.h[c.s] = (invest/picks.length)/prices[c.s]; });
    return o;
  });
}

function freshState(){
  var st = {
    v:1, tick:0, cash:3000, seedCash:3000, sentiment:0, speed:1,
    prices:{}, hist:{}, dayRef:{},
    lots:[], lotSeq:0,  /* one per buy: {id, s, q, p (entry), t, sl, tp} */
    fee:FEE_DEFAULT,
    trades:[], news:[], pending:[], reviews:[],
    realised:0, volume:0, tradeCount:0, dipBuys:0, winners:0,
    realisedGain:0,
    level:1, xp:0, owned:[], quests:[], questLog:[], bots:[], seenQuests:0,
    questSwaps:0, swapSpent:0, questStats:{},
    peak:3000, started:Date.now()
  };
  COINS.forEach(function(c){
    st.prices[c.s]=c.p0;
    st.hist[c.s]=seedHistory(c, c.p0);
    st.dayRef[c.s]=st.hist[c.s][Math.max(0,HISTORY-TICKS_PER_DAY)];
  });
  st.bots = defaultBots(st.prices);
  for(var q=0;q<3;q++) st.quests.push(makeQuest(st));
  pushNews(st,"Markets open. You start with "+money(st.cash)+" of play money.");
  return st;
}

/* a believable past for a coin: a walk at its own volatility, renormalised
   so the visible history ends at `end` */
function seedHistory(c, end){
  var h=[], p=end;
  for(var i=0;i<HISTORY;i++){ p=p*(1+c.dr+c.ts*randn()*0.9); h.push(p); }
  var k=end/h[h.length-1];
  for(var j=0;j<h.length;j++) h[j]=h[j]*k;
  return h;
}

/* `slot` is the index being replaced (a swap or a claim), if any. That quest
   still counts as taken, so the new one is a different kind, but not towards
   the market cap, since it is leaving the board */
function makeQuest(st, slot){
  var live = Feed.mode==="live";
  /* never two of the same kind on the board at once */
  var board = st.quests||[];
  var taken = board.map(function(q){ return q.t; });
  var pool = QUEST_POOL.filter(function(d){ return taken.indexOf(d.t)<0; });
  var market = board.filter(function(q,i){ return i!==slot && isMarketQuest(q); }).length;
  var day = board.filter(function(q,i){ return i!==slot && isDayQuest(q); }).length;
  if(live && market>=LIVE_MARKET_CAP){
    var quick = pool.filter(function(d){ return !d.market; });
    if(quick.length) pool = quick;
  }
  if(live && day>=LIVE_DAY_CAP){
    var short = pool.filter(function(d){ return !d.day; });
    if(short.length) pool = short;
  }
  var def = pick(pool.length ? pool : QUEST_POOL);
  var lv = clamp(Math.floor((st.level-1)/2),0,3);
  var nw = netWorthOf(st);
  var target = def.vals[lv];
  if(live && def.t==="profit") target = Math.max(10, Math.round(nw*def.live[lv]*LIVE_TUNE.profitScale/10)*10);
  else if(live && def.t==="nw") target = Math.round(nw*(1+def.live[lv]+Math.random()*0.01)/10)*10;
  else if(def.t==="nw") target = Math.max(target, Math.round(nw*(1.25+Math.random()*0.35)/100)*100);
  var pct = def.pct ? def.pct[live?"live":"sim"] : 0;
  if(live && def.t==="winner") pct = LIVE_TUNE.winnerPct;
  /* a flat reward is a windfall at the start and pocket change later, so pay a
     slice of current net worth instead: always worth doing, never a shortcut */
  var reward = live
    ? Math.max(LIVE_TUNE.rewardFloor, Math.round(nw*(def.market?LIVE_TUNE.marketReward:LIVE_TUNE.quickReward)*(1+Math.random())/10)*10)    /* live goals are smaller, so is the pay */
    : Math.max(150, Math.round(nw*(0.03+Math.random()*0.04)/10)*10);
  var q = {
    id:(st.seenQuests=(st.seenQuests||0)+1),
    t:def.t, target:target, money:!!def.money, abs:!!def.abs, live:live,
    txt:def.txt(target, pct),
    base: questCounter(st, def.t),
    reward:reward, xp:Math.round(xpNeeded(st.level)*0.35), claimed:false,
    drawnAt:Date.now()
  };
  if(def.t==="profit") q.gain=true;
  /* dip and winner thresholds differ by mode, so they count their own events */
  if(def.own){ q.own=true; q.pct=pct; q.n=0; }
  return q;
}
/* swap out quests that no longer fit (a mode switch, duplicates or an all
   market live board in an old save) but keep any that are finished and
   waiting to be claimed */
function refreshQuests(st, all){
  var keep=[], market=0, day=0, live=Feed.mode==="live";
  (st.quests||[]).forEach(function(q){
    var done = questProgressOf(st,q) >= q.target;
    var dup = keep.some(function(k){ return k.t===q.t; });
    var over = live && !done && ((isMarketQuest(q) && market>=LIVE_MARKET_CAP) || (isDayQuest(q) && day>=LIVE_DAY_CAP));
    if(!dup && !over && (done || !all)){ keep.push(q); if(isMarketQuest(q)) market++; if(isDayQuest(q)) day++; }
  });
  st.quests = keep;
  while(st.quests.length<3) st.quests.push(makeQuest(st));
}
function questCounter(st,t){
  switch(t){
    case "trades": return st.tradeCount;
    case "volume": return st.volume;
    case "profit": return st.realisedGain;   /* winning sales only: fees on losing round trips must not undo it */
    case "dip":    return st.dipBuys;
    case "winner": return st.winners;
    case "nw":     return netWorthOf(st);
    case "spread": return heldSyms(st).length;
  }
  return 0;
}
function questProgressOf(st,q){
  if(q.own) return q.n||0;
  var cur = questCounter(st,q.t);
  return q.abs ? cur : (cur - q.base);
}
function questProgress(q){ return questProgressOf(S,q); }
/* biggest drop on the board, for the dip quest hint */
function biggestDrop(){
  var best=null;
  COINS.forEach(function(c){ var ch=dayChange(c.s); if(best===null || ch<best.ch) best={s:c.s, ch:ch}; });
  return best;
}

/* ============================ economics ============================ */
function netWorthOf(st){
  var v = st.cash;
  st.lots.forEach(function(l){ v += l.q * st.prices[l.s]; });
  return v;
}
function netWorth(){ return netWorthOf(S); }
function holdingsValue(){
  var v=0; S.lots.forEach(function(l){ v += l.q*S.prices[l.s]; }); return v;
}
/* trades: every buy is its own lot with its own entry and exit rules */
function heldSyms(st){
  var out=[]; st.lots.forEach(function(l){ if(out.indexOf(l.s)<0) out.push(l.s); }); return out;
}
function lotsOf(sym){ return S.lots.filter(function(l){ return l.s===sym; }); }
function lotById(id){
  for(var i=0;i<S.lots.length;i++) if(S.lots[i].id===id) return S.lots[i];
  return null;
}
/* a coin's trades taken together: total held and the average entry */
function position(sym){
  var q=0, c=0;
  lotsOf(sym).forEach(function(l){ q+=l.q; c+=l.q*l.p; });
  return q>0 ? {q:q, avg:c/q} : null;
}
/* what selling q of these lots, oldest first, cost when they were bought */
function costOf(lots, q){
  var c=0;
  lots.forEach(function(l){ var take=Math.min(l.q, q); c+=take*l.p; q-=take; });
  return c;
}
function dayChange(sym){
  if(Feed.mode==="live" && Feed.status==="ok"){
    var a=Feed.anchors[sym];
    if(a && typeof a.chg==="number") return a.chg;
  }
  var ref = S.dayRef[sym] || S.prices[sym];
  return (S.prices[sym]/ref - 1)*100;
}
function botWorth(b){
  var v=b.cash; for(var s in b.h){ v += b.h[s]*S.prices[s]; } return v;
}
function flexPoints(){
  var f=0; S.owned.forEach(function(id){ var it=SHOP.filter(function(x){return x.id===id;})[0]; if(it) f+=it.f; });
  return f;
}
function xpNeeded(lv){ return 120 + (lv-1)*95; }
function tradeXP(){ return Math.max(4, Math.round(xpNeeded(S.level)*0.02)); }
function title(){
  var lv=S.level;
  if(lv>=13) return "Market maker";
  if(lv>=10) return "Fund manager";
  if(lv>=7)  return "Desk trader";
  if(lv>=5)  return "Swing trader";
  if(lv>=3)  return "Apprentice";
  return "Paper hands";
}

function pushNews(st,text,sym){
  st.news.unshift({t:st.tick, x:text, s:sym||null});
  if(st.news.length>25) st.news.pop();
}

/* ============================ the tick ============================ */
function step(){
  S.tick++;
  S.sentiment = clamp(S.sentiment*0.97 + randn()*0.13, -2.2, 2.2);

  var changed = {};
  var anchored = (Feed.mode==="live" && Feed.status==="ok");
  var mkt = randn();                 /* one shared move, felt by every coin */
  COINS.forEach(function(c){
    /* live: real speed, so the chart moves between polls by what the market
       could plausibly do in a tick, and stays within ~0.05% of the real price */
    var sig = anchored ? c.lts/Math.sqrt(S.speed||1) : c.ts;
    var ret = (anchored ? 0 : c.dr + c.ts*0.05*S.sentiment)  /* drift and slow regime tilt */
            + sig*c.sqC*mkt          /* market factor */
            + sig*c.sqI*randn();     /* this coin's own news */
    var p = S.prices[c.s]*(1+ret);
    if(anchored){
      var a=Feed.anchors[c.s];
      if(a) p = p + (a.p - p)*0.10;   /* pull back toward the real price */
    }
    if(p < c.p0*0.02) p = c.p0*0.02*(1+Math.abs(randn())*0.02);
    changed[c.s] = p - S.prices[c.s];
    S.prices[c.s] = p;
    var h=S.hist[c.s]; h.push(p); if(h.length>HISTORY) h.shift();
    S.dayRef[c.s] = h[Math.max(0, h.length-TICKS_PER_DAY)];
  });

  if(!anchored && Math.random() < EVENT_RATE) fireEvent();
  S.bots.forEach(stepBot);
  checkOrders();
  checkReviews();

  var nw = netWorth();
  if(nw > S.peak) S.peak = nw;

  paint(changed);
  if(S.tick % 6 === 0) save();
}

function fireEvent(){
  var marketWide = Math.random()<0.22;
  var good = Math.random()<0.5;
  if(marketWide){
    /* sized in units of each coin's daily sigma, so one headline moves BTC a
       little and DOGE a lot rather than moving both the same */
    var k = (0.6+Math.random()*1.2)*(good?1:-1);
    COINS.forEach(function(c){
      S.prices[c.s] *= (1 + k*c.dv);
      var h=S.hist[c.s]; h[h.length-1]=S.prices[c.s];
    });
    S.sentiment = clamp(S.sentiment + (good?0.9:-0.9), -2.2, 2.2);
    pushNews(S, pick(good?GOOD_MKT:BAD_MKT));
  }else{
    var c2 = pick(COINS);
    var m = (1.0+Math.random()*2.5)*(good?1:-1)*c2.dv;
    S.prices[c2.s] *= (1+m);
    var h2=S.hist[c2.s]; h2[h2.length-1]=S.prices[c2.s];
    pushNews(S, pick(good?GOOD_COIN:BAD_COIN).replace("{n}",c2.n).replace("{s}",c2.s), c2.s);
  }
  flagNews();
}

function stepBot(b){
  /* skill used to apply to idle cash only, which is a sliver of a bot's book,
     so good traders barely pulled ahead. Compound the whole position. */
  if(b.skill){
    b.cash *= (1 + b.skill);
    for(var s0 in b.h) b.h[s0] *= (1 + b.skill);
  }
  if(Math.random() > 1/110) return;
  var syms = Object.keys(b.h).filter(function(s){ return b.h[s]*S.prices[s] > 1; });
  var buy;
  if(b.style==="hodl") buy = Math.random()<0.7;
  else if(b.style==="panic") buy = S.sentiment>0.6 ? Math.random()<0.8 : Math.random()<0.15;
  else if(b.style==="momo") buy = S.sentiment>0 ? Math.random()<0.75 : Math.random()<0.35;
  else if(b.style==="contra") buy = S.sentiment<0 ? Math.random()<0.75 : Math.random()<0.25;
  else if(b.style==="dca") buy = Math.random()<0.62;
  else buy = Math.random()<0.5;

  if(buy && b.cash>20){
    var c = pick(COINS);
    var spend = b.cash*(0.2+Math.random()*0.5);
    b.h[c.s] = (b.h[c.s]||0) + spend/S.prices[c.s];
    b.cash -= spend;
  }else if(syms.length){
    var s2 = pick(syms);
    var part = 0.25+Math.random()*0.6;
    var q = b.h[s2]*part;
    b.cash += q*S.prices[s2];
    b.h[s2] -= q;
    if(b.h[s2]*S.prices[s2] < 0.5) delete b.h[s2];
  }
}

var REVIEW_LAG = 80;   /* a third of a game day */
function checkReviews(){
  if(!S.pending.length) return;
  var ripe=[];
  S.pending = S.pending.filter(function(r){
    if(S.tick - r.t < REVIEW_LAG) return true;
    ripe.push(r); return false;
  });
  ripe.forEach(function(r){
    var now = S.prices[r.s]; if(!now) return;
    S.reviews.unshift({s:r.s, p:r.p, now:now, chg:(now/r.p-1)*100, t:S.tick, auto:r.auto});
    if(S.reviews.length>8) S.reviews.pop();
    if(tab!=="wallet"){ walletDot=true; buildTabs(); }
  });
}

function checkOrders(){
  /* each trade has its own rules; a copy, because selling removes lots */
  S.lots.slice().forEach(function(l){
    if(!lotById(l.id)) return;
    var p=S.prices[l.s];
    if(l.sl && p<=l.sl) sellFrom([l], l.q, "Stop loss triggered on "+l.s);
    else if(l.tp && p>=l.tp) sellFrom([l], l.q, "Take profit hit on "+l.s);
  });
}

/* ============================ trading ============================ */
/* rules: optional {sl, tp} in percent below and above this trade's entry */
function buy(sym, usd, rules){
  usd = Math.min(usd, S.cash);
  if(!(usd>0.01)) return toast("Enter an amount first");
  var p = S.prices[sym];
  var fee = usd*S.fee;
  var q = (usd-fee)/p;
  var lot = {id:(S.lotSeq=(S.lotSeq||0)+1), s:sym, q:q, p:p, t:S.tick, sl:0, tp:0};
  if(rules){
    if(rules.sl>0 && rules.sl<100) lot.sl = p*(1-rules.sl/100);
    if(rules.tp>0) lot.tp = p*(1+rules.tp/100);
  }
  S.lots.push(lot);
  S.cash -= usd;
  S.tradeCount++; S.volume += usd;
  var dc = dayChange(sym);
  if(dc <= -4) S.dipBuys++;
  S.quests.forEach(function(qq){ if(qq.own && qq.t==="dip" && !qq.claimed && dc <= -qq.pct) qq.n++; });
  S.trades.unshift({t:S.tick,s:sym,side:"buy",q:q,p:p,usd:usd,pnl:0});
  if(S.trades.length>40) S.trades.pop();
  addXP(tradeXP());
  toast("Bought "+qtyStr(q)+" "+sym+(lot.sl||lot.tp ? ", exit rule set" : ""));
  afterTrade();
}
/* sell q of a coin, oldest trades first */
function sell(sym, q, msg){ sellFrom(lotsOf(sym), q, msg); }
/* sell q out of these lots, in order: one sale, one review, one trade row */
function sellFrom(lots, q, msg){
  var have=0; lots.forEach(function(l){ have+=l.q; });
  q = Math.min(q, have);
  if(!lots.length || !(q>0)) return toast("Nothing to sell");
  var sym = lots[0].s, p = S.prices[sym];
  var gross = q*p, fee = gross*S.fee, net = gross-fee;
  var cost = costOf(lots, q);
  var pnl = net-cost;
  var left=q;
  lots.forEach(function(l){ var take=Math.min(l.q, left); l.q-=take; left-=take; });
  /* drop sold-out trades and dust worth under a cent */
  S.lots = S.lots.filter(function(l){ return l.q*S.prices[l.s] >= 0.01; });
  S.cash += net;
  S.realised += pnl;
  if(pnl > 0) S.realisedGain += pnl;
  S.tradeCount++; S.volume += gross;
  if(pnl > cost*0.10) S.winners++;
  S.quests.forEach(function(qq){ if(qq.own && qq.t==="winner" && !qq.claimed && pnl >= cost*qq.pct/100) qq.n++; });
  S.trades.unshift({t:S.tick,s:sym,side:"sell",q:q,p:p,usd:net,pnl:pnl});
  if(S.trades.length>40) S.trades.pop();
  /* come back in a third of a game day and see what the price did next */
  S.pending.push({s:sym, p:p, t:S.tick, auto:!!msg});
  if(S.pending.length>12) S.pending.shift();
  addXP(pnl>0 ? tradeXP()*2 : tradeXP());
  toast(msg || ("Sold "+qtyStr(q)+" "+sym+" for "+moneyFull(net)));
  afterTrade();
}
function afterTrade(){
  checkQuests();
  save();
  paint({});
  if(sheetCtx && sheetCtx.kind==="coin") renderCoinSheet(sheetCtx.sym, sheetCtx.side, true, sheetCtx.lot);
}
function addXP(n){
  S.xp += n;
  while(S.xp >= xpNeeded(S.level)){ S.xp -= xpNeeded(S.level); S.level++; toast("Level "+S.level+". You are now a "+title().toLowerCase()+"."); }
}
function checkQuests(){ paintTabExtras(); }
/* indexes of quests finished and waiting to be claimed. Always computed, never
   stored: a net worth quest can slip back under its target when prices fall */
function readyQuests(){
  var a=[];
  S.quests.forEach(function(q,i){ if(questProgress(q)>=q.target) a.push(i); });
  return a;
}
/* swapping an unfinished quest costs half its reward, rounded to $10: always
   less than finishing it pays, never free, and it scales with net worth and
   mode the way rewards do (a flat fee would exceed every live reward early on
   and be pocket change later) */
function swapFee(q){ return Math.max(10, Math.round(q.reward/20)*10); }
/* lifetime counts per quest kind and mode, e.g. "live:winner": how many were
   finished, how many swapped away, and the total time the finished ones took.
   Swaps per claim and time to finish are how we tell whether quests fit */
function questStat(q){
  var k=(q.live?"live":"sim")+":"+q.t;
  return S.questStats[k] || (S.questStats[k]={done:0, swap:0, ms:0});
}
function questAge(q){ return q.drawnAt>0 ? Math.max(0, Date.now()-q.drawnAt) : 0; }
function swapQuest(idx){
  var q=S.quests[idx], fee=swapFee(q);
  if(S.cash < fee) return 0;
  S.cash -= fee;
  S.questSwaps++; S.swapSpent += fee; questStat(q).swap++;
  /* the old quest is still on the board here, so makeQuest never redraws its kind */
  S.quests[idx]=makeQuest(S, idx);
  return fee;
}
function claimQuest(idx){
  var q=S.quests[idx], ms=questAge(q), st=questStat(q);
  S.cash += q.reward; addXP(q.xp);
  S.questLog.unshift({txt:q.txt, t:q.t, reward:q.reward, xp:q.xp, live:!!q.live, at:Date.now(), ms:ms});
  if(S.questLog.length>QUEST_LOG_MAX) S.questLog.length=QUEST_LOG_MAX;
  S.questDone = (S.questDone||0)+1; S.questEarned = (S.questEarned||0)+q.reward;
  st.done++; st.ms += ms;
  S.quests[idx]=makeQuest(S, idx);
  return q.reward;
}
/* the pill: claim everything that is ready, then show the fresh quests */
function claimAll(){
  var idx=readyQuests(), total=0;
  if(!idx.length) return;
  idx.forEach(function(i){ total+=claimQuest(i); });
  save();
  go("quests");
  toast("Claimed "+money(total)+(idx.length>1?" from "+idx.length+" quests":""));
}

/* ============================ storage ============================ */
var NUM_FIELDS = {tick:0, cash:3000, seedCash:3000, sentiment:0, speed:1, realised:0, volume:0,
  tradeCount:0, dipBuys:0, winners:0, level:1, xp:0, seenQuests:0, peak:3000,
  questDone:0, questEarned:0, lotSeq:0, questSwaps:0, swapSpent:0, realisedGain:0};
var ARR_FIELDS = {trades:1, news:1, owned:1, quests:1, questLog:1, bots:1, pending:1, reviews:1, lots:1};

/* A save can be truncated or hand edited. Repair it rather than throwing it away. */
function heal(o){
  var k;
  for(k in NUM_FIELDS){
    if(typeof o[k]!=="number" || !isFinite(o[k])) o[k]=NUM_FIELDS[k];
  }
  for(k in ARR_FIELDS){ if(!Array.isArray(o[k])) o[k]=[]; }
  if(!o.prices || typeof o.prices!=="object") o.prices={};
  if(!o.hist   || typeof o.hist!=="object")   o.hist={};
  if(!o.dayRef || typeof o.dayRef!=="object") o.dayRef={};

  COINS.forEach(function(c){
    if(typeof o.prices[c.s]!=="number" || !isFinite(o.prices[c.s]) || o.prices[c.s]<=0) o.prices[c.s]=c.p0;
    var h=o.hist[c.s];
    /* a coin the save has never seen (added in a later version) gets a
       generated past, so its chart and day change are not a flat line */
    if(!Array.isArray(h) || !h.length) h=seedHistory(c, o.prices[c.s]);
    h=h.filter(function(v){ return typeof v==="number" && isFinite(v) && v>0; });
    if(!h.length) h=[o.prices[c.s]];
    if(h.length>HISTORY) h=h.slice(h.length-HISTORY);
    o.hist[c.s]=h;
    if(typeof o.dayRef[c.s]!=="number" || !isFinite(o.dayRef[c.s]) || o.dayRef[c.s]<=0){
      o.dayRef[c.s]=h[Math.max(0,h.length-TICKS_PER_DAY)];
    }
  });

  /* before 1.6.1 a coin was one position, {q, avg, sl, tp}, in o.hold: each
     becomes one trade, keeping its entry and exit rules */
  if(o.hold && typeof o.hold==="object"){
    Object.keys(o.hold).forEach(function(s){
      var h=o.hold[s]; if(!h) return;
      o.lots.push({id:0, s:s, q:h.q, p:h.avg, t:o.tick, sl:h.sl, tp:h.tp});
    });
  }
  delete o.hold;
  var fin=function(v){ return typeof v==="number" && isFinite(v); };
  o.lots = o.lots.filter(function(l){
    if(!l || typeof l.s!=="string" || !fin(l.q) || l.q<=0) return false;
    /* the coin list can shrink between versions: return the money rather than
       quietly deleting someone's position */
    if(!BYSYM[l.s]){
      if(fin(o.prices[l.s])) o.cash += l.q*o.prices[l.s];
      return false;
    }
    if(!fin(l.p) || l.p<=0) return false;
    if(!fin(l.sl) || l.sl<0) l.sl=0;
    if(!fin(l.tp) || l.tp<0) l.tp=0;
    if(!fin(l.t)) l.t=o.tick;
    return true;
  });
  /* ids: keep good unique ones, number the rest after the highest */
  var seen={}, top=o.lotSeq;
  o.lots.forEach(function(l){ if(fin(l.id) && l.id>0 && !seen[l.id]){ seen[l.id]=1; if(l.id>top) top=l.id; } else l.id=0; });
  o.lots.forEach(function(l){ if(!l.id) l.id=++top; });
  o.lotSeq=top;
  if(!fin(o.fee) || o.fee<0 || o.fee>0.01) o.fee=FEE_DEFAULT;

  o.trades = o.trades.filter(function(t){ return t && typeof t.s==="string" && typeof t.q==="number"; }).slice(0,40);
  o.news   = o.news.filter(function(n){ return n && typeof n.x==="string"; }).slice(0,25);
  o.pending= o.pending.filter(function(r){ return r && BYSYM[r.s] && typeof r.p==="number"; }).slice(0,12);
  o.reviews= o.reviews.filter(function(r){ return r && typeof r.s==="string" && typeof r.chg==="number"; }).slice(0,8);
  o.owned  = o.owned.filter(function(id){ return SHOP.some(function(i){ return i.id===id; }); });
  o.quests = o.quests.filter(function(q){ return q && typeof q.t==="string" && typeof q.target==="number" && typeof q.txt==="string"; }).slice(0,3);
  o.questLog = o.questLog.filter(function(e){ return e && typeof e.txt==="string" && typeof e.reward==="number" && isFinite(e.reward); }).slice(0,QUEST_LOG_MAX);
  o.quests.forEach(function(q){
    if(q.own && !(typeof q.n==="number" && isFinite(q.n))) q.n=0; if(q.own && !(q.pct>0)) q.pct=3;
    /* before 1.9.0 a profit quest counted realised profit net of losses:
       re-base it on winning sales, from now */
    if(q.t==="profit" && !q.gain){ q.gain=true; q.base=o.realisedGain; }
    /* quests from before 1.9.0 have no draw time: start their clock now */
    if(!(typeof q.drawnAt==="number" && isFinite(q.drawnAt) && q.drawnAt>0)) q.drawnAt=Date.now();
  });
  if(!o.questStats || typeof o.questStats!=="object" || Array.isArray(o.questStats)) o.questStats={};
  Object.keys(o.questStats).forEach(function(k){
    var e=o.questStats[k], m=/^(live|sim):(\w+)$/.exec(k);
    if(!m || !QUEST_DEF[m[2]] || !e || typeof e!=="object"){ delete o.questStats[k]; return; }
    ["done","swap","ms"].forEach(function(f){ if(!(typeof e[f]==="number" && isFinite(e[f]) && e[f]>=0)) e[f]=0; });
  });
  if(!o.bots.length) o.bots = defaultBots(o.prices);
  o.bots = o.bots.filter(function(b){ return b && typeof b.cash==="number" && isFinite(b.cash) && b.h; });
  o.bots.forEach(function(b){
    delete b.e;   /* rivals used to carry their emoji; icons now come from BOT_DEFS */
    Object.keys(b.h).forEach(function(s){
      var q=b.h[s];
      if(!BYSYM[s] || typeof q!=="number" || !isFinite(q) || q<=0){
        if(BYSYM[s]===undefined && typeof q==="number" && isFinite(q) && typeof o.prices[s]==="number") b.cash += q*o.prices[s];
        delete b.h[s];
      }
    });
  });
  if(!o.bots.length) o.bots = defaultBots(o.prices);
  [o.prices,o.hist,o.dayRef].forEach(function(mapObj){
    Object.keys(mapObj).forEach(function(s){ if(!BYSYM[s]) delete mapObj[s]; });
  });
  if(o.speed!==0 && o.speed!==1 && o.speed!==2 && o.speed!==4) o.speed=1;
  if(o.level<1) o.level=1;
  return o;
}

function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || typeof o!=="object" || o.v!==1) return null;
    return heal(o);
  }catch(e){ return null; }
}

function whenAgo(at){
  var s=Math.max(0,(Date.now()-(at||0))/1000);
  if(!at || !isFinite(s)) return "Earlier";
  if(s<60) return "Just now";
  if(s<3600) return Math.floor(s/60)+" min ago";
  if(s<86400) return Math.floor(s/3600)+" h ago";
  var d=Math.floor(s/86400); return d===1 ? "Yesterday" : d+" days ago";
}

function durStr(ms){
  var mn=ms/60000;
  if(mn<1) return "under a minute";
  if(mn<90) return Math.round(mn)+" min";

}
/* per kind: what got finished, what got swapped away, how long finishing took.
   A kind that is swapped more often than finished does not fit its mode */
function renderQuestStats(m){
  var keys=Object.keys(S.questStats).filter(function(k){ var e=S.questStats[k]; return e.done||e.swap; });
  if(!keys.length) return;
  keys.sort(function(a,b){ var x=S.questStats[a], y=S.questStats[b]; return (y.done+y.swap)-(x.done+x.swap); });
  var L=el("div","list"); L.id="questStats";
  keys.forEach(function(k){
    var e=S.questStats[k], mode=k.split(":")[0], def=QUEST_DEF[k.split(":")[1]];
    var d=el("div","quest");
    var qh=el("div","qh");

    d.appendChild(qh);

}
function paintQuests(){
  var arr=refs._q; if(!arr) return;
  arr.forEach(function(r){
    var q=r.q, prog=clamp(questProgress(q),0,q.target);
    r.lbl.textContent=(q.money?money(prog):Math.floor(prog))+" of "+(q.money?money(q.target):q.target);
    /* a net worth goal starts from where you stood, not from zero, or a fresh
       quest would open at 98% */
    var frac = (q.t==="nw" && q.base<q.target) ? clamp((prog-q.base)/(q.target-q.base),0,1) : prog/q.target;
    r.pc.textContent=Math.round(100*frac)+"%";
    r.fill.style.width=(100*frac)+"%";
    if(r.hint){
      var bd=biggestDrop(), pct=q.own?q.pct:4;
      r.hint.textContent = bd && bd.ch <= -pct
        ? bd.s+" is down "+Math.abs(bd.ch).toFixed(1)+"% today, so a buy counts now."
        : "Nothing is down "+pct+"% yet. The market list shows each coin's change today, or swap this quest below.";
    }
    /* finished: claim. Unfinished: swap. Rebuilt only when that flips, so a
       swap button armed for its second tap survives the per-tick repaint */
    var mode = prog>=q.target ? "claim" : "swap";
    if(r.mode!==mode){
      r.mode=mode; r.slot.textContent="";
      if(mode==="claim"){
        var btn=el("button","claim","Claim reward");
        btn.addEventListener("click",function(){
          toast("Claimed "+money(claimQuest(r.idx)));
          save(); render();
        });
        r.slot.appendChild(btn);
      } else r.slot.appendChild(swapButton(r));
    }
  });
}
/* two taps, no dialog: the first arms the button and names the price */
function swapButton(r){
  var fee=swapFee(r.q), idle="Swap for "+money(fee);
  var row=el("div","swaprow"), b=el("button","swap",idle);
  b.type="button";
  b.addEventListener("click",function(){
    if(!b.classList.contains("armed")){
      b.classList.add("armed"); b.textContent="Tap again to pay "+money(fee);
      clearTimeout(b._t);
      b._t=setTimeout(function(){ b.classList.remove("armed"); b.textContent=idle; },3000);
      return;
    }
    clearTimeout(b._t);
    if(!swapQuest(r.idx)){
      b.classList.remove("armed"); b.textContent=idle;
      toast("Not enough cash to swap. Sell something first.");
      return;
    }
    save(); render();
    toast("Swapped for "+money(fee));
  });
  row.appendChild(b);
  return row;
}

/* ============================ paint (per tick) ============================ */
function paint(changed){
  changed = changed||{};
  var nw=netWorth();
  $("#nwNum").textContent = moneyFull(nw);
  var chg = (nw/(S.seedCash||3000)-1)*100;
  var e=$("#nwChg");
  e.textContent = pctStr(chg)+" all time";
  e.className = "nw-chg "+cls(chg);
  var hs=$("#hdrStatus");
  if(hs){
    var liveOk = Feed.mode==="live" && Feed.status==="ok";
    hs.firstChild.className = liveOk ? "live" : "";
    /* short labels: the header has about 55px for this at 320px wide. The dot
       carries the state; the full wording is the tooltip and the spoken label */
    var full = liveOk ? "Live prices" : (Feed.mode==="live" ? "Live feed offline" : "Simulated market");
    hs.lastChild.textContent = liveOk ? "Live" : (Feed.mode==="live" ? "Offline" : "Simulator");
    if(hs.title!==full){ hs.title=full; hs.setAttribute("aria-label",full); }
  }


  if(tab==="market"){
    COINS.forEach(function(c){
      var r=refs[c.s]; if(!r) return;
      var p=S.prices[c.s];
      r.price.textContent = priceStr(p);
      var d=dayChange(c.s);
      r.chg.textContent = pctStr(d);
      r.chg.className = cls(d);
      var h=S.hist[c.s], n=Math.min(40,h.length), sl=h.slice(h.length-n);
      var mn=Math.min.apply(null,sl), mx=Math.max.apply(null,sl), rg=(mx-mn)||1;
      var pts=""; for(var i=0;i<sl.length;i++){
        pts += (i*(52/(sl.length-1||1))).toFixed(1)+","+(21-((sl[i]-mn)/rg)*20).toFixed(1)+" ";
      }
      r.line.setAttribute("points",pts.trim());
      r.line.setAttribute("stroke", d>=0?"var(--up)":"var(--down)");
      var mv = changed[c.s];
      if(mv!==undefined && Math.abs(mv/p) > 0.0025){
        var cell = r.price.parentNode;
        cell.classList.remove("flash-up","flash-down");
        void cell.offsetWidth;
        cell.classList.add(mv>0?"flash-up":"flash-down");
      }
    });
    if(refs._src){
      refs._src.hidden = Feed.mode!=="live";
      refs._src.firstChild.className = Feed.dot();
      refs._src.lastChild.textContent = Feed.label();

    }

  } else if(tab==="wallet"){ paintWallet(); }
  else if(tab==="quests"){ paintQuests(); }
  else if(tab==="ranks"){ paintRanks(); }

  if(sheetCtx && sheetCtx.kind==="coin") paintCoinSheet();
  paintTabExtras();
}

  nm.appendChild(el("small",null, lot ? "Bought on day "+dayOf(lot.t)+" at "+priceStr(lot.p)+", typical day ±"+(c.dv*100).toFixed(1)+"%"
                                      : sym+", typical day \u00B1"+(c.dv*100).toFixed(1)+"%"));
  var v=el("div","val"); var pv=el("b"); var ch=el("small"); v.appendChild(pv); v.appendChild(ch);
  head.appendChild(ic); head.appendChild(nm); head.appendChild(v);
  b.appendChild(head);

  var crt=el("div","crt"); var cv=el("canvas"); cv.id="chart"; crt.appendChild(cv); b.appendChild(crt);

  var seg=el("div","seg");
  var bb=el("button",null,"Buy"), sb=el("button",null,"Sell");
  bb.setAttribute("aria-pressed", sheetCtx.side==="buy");
  sb.setAttribute("aria-pressed", sheetCtx.side==="sell");
  bb.addEventListener("click",function(){ renderCoinSheet(sym,"buy"); });
  sb.addEventListener("click",function(){ renderCoinSheet(sym,"sell"); });
  seg.appendChild(bb); seg.appendChild(sb);
  if(!lot) b.appendChild(seg);

  var maxUsd = sheetCtx.side==="buy" ? S.cash : (h? h.q*S.prices[sym] : 0);

  var amt=el("div","amt");
  amt.appendChild(el("span",null,"$"));
  var inp=el("input"); inp.type="text"; inp.inputMode="decimal"; inp.placeholder="0.00";
  inp.setAttribute("aria-label","Amount in dollars");
  amt.appendChild(inp);
  b.appendChild(amt);

  var chips=el("div","chips");
  [[0.25,"25%"],[0.5,"50%"],[0.75,"75%"],[1,"Max"]].forEach(function(p){
    var cb=el("button",null,p[1]);
    /* round down: toFixed rounds $1,511.026 up to 1511.03, more than you have */
    cb.addEventListener("click",function(){ inp.value=(Math.floor(maxUsd*p[0]*100)/100).toFixed(2); updateSummary(); });
    chips.appendChild(cb);
  });
  b.appendChild(chips);

  /* exit rules can be set with the buy, so the trade is protected from its first tick */
  var rules=null;
  if(sheetCtx.side==="buy"){
    var rh=el("h2","sec","Automatic exit, optional"); rh.style.marginTop="14px"; b.appendChild(rh);
    rules=exitInputs(0,0,0); b.appendChild(rules.box);
  }

  var sumWrap=el("div"); b.appendChild(sumWrap);

  var go=el("button","btn "+(sheetCtx.side==="buy"?"buy":"sell"));
  go.textContent = sheetCtx.side==="buy" ? "Buy "+sym : (lot ? "Sell this trade" : "Sell "+sym);
  go.addEventListener("click",function(){
    var val=parseFloat(inp.value);
    if(!(val>0)) return toast("Enter an amount first");
    if(sheetCtx.side==="buy"){
      /* cash is not whole cents; anything within half a cent is "all of it",
         and buy() caps the spend at what you have */
      if(val>S.cash+0.005) return toast("You only have "+moneyFull(S.cash)+" in cash");
      if(val>S.cash-0.01) val=S.cash;   /* Max, or a typed balance: spend it all, no dust left */
      buy(sym, val, {sl:parseFloat(rules.sl.value), tp:parseFloat(rules.tp.value)});
    }else{
      if(!h) return toast("You do not hold any "+sym);
      var q=Math.min(h.q, val/S.prices[sym]);
      if(lot) sellFrom([lot], q); else sell(sym,q);
    }
    inp.value="";
    updateSummary();
  });
  b.appendChild(go);

  if(lot){
    /* this trade's own exit rules, from its own entry */
    var hd=el("h2","sec","Automatic exit");
    hd.style.marginTop="18px"; b.appendChild(hd);
    var ex=exitInputs(lot.p, lot.sl, lot.tp);
    b.appendChild(ex.box);
    var sv=el("button","btn ghost","Save exit rules"); sv.style.marginTop="9px";
    sv.addEventListener("click",function(){
      var a=parseFloat(ex.sl.value), z=parseFloat(ex.tp.value);
      lot.sl = (a>0&&a<100) ? lot.p*(1-a/100) : 0;
      lot.tp = (z>0) ? lot.p*(1+z/100) : 0;
      save(); toast(lot.sl||lot.tp ? "Exit rules saved" : "Exit rules cleared");
      paint({}); paintCoinSheet();
    });
    b.appendChild(sv);
    var all=el("button","btn ghost","All "+sym+" trades"); all.style.marginTop="9px";
    all.addEventListener("click",function(){ renderCoinSheet(sym,"sell"); });
    b.appendChild(all);
  } else {
    var mine=lotsOf(sym);
    if(mine.length){
      var th=el("h2","sec","Your "+sym+" trades"); th.style.marginTop="18px"; b.appendChild(th);
      if(sheetCtx.side==="sell" && mine.length>1){
        var fifo=el("p","note","Selling here takes from your oldest trade first. Open a trade to sell it on its own or set its exit rules.");
        fifo.style.margin="0 0 8px"; b.appendChild(fifo);
      }
      var TL=el("div","list");
      mine.forEach(function(l){ TL.appendChild(lotRow(l, function(){ renderCoinSheet(sym,"sell",false,l.id); })); });
      b.appendChild(TL);
    }
  }

  var cl=el("button","btn ghost","Close"); cl.style.marginTop="9px";
  cl.addEventListener("click", closeSheet);
  b.appendChild(cl);

  sheetCtx.nodes={price:pv,chg:ch,canvas:cv,sum:sumWrap,input:inp,max:maxUsd};
  inp.addEventListener("input", updateSummary);
  updateSummary();
  paintCoinSheet();
  openSheet();

  function updateSummary(){
    var val=parseFloat(inp.value)||0;
    var p=S.prices[sym];
    sumWrap.textContent="";
    var rows=[];
    if(sheetCtx.side==="buy"){
      var fee=val*S.fee, q=(val-fee)/p;
      rows.push(["You receive", qtyStr(Math.max(0,q))+" "+sym]);
      rows.push(["Fee ("+feePct()+")", moneyFull(fee)]);
      rows.push(["Cash after", moneyFull(S.cash-val)]);
    }else{
      var q2=Math.min(h?h.q:0, val/p);
      var gross=q2*p, fee2=gross*S.fee;
      rows.push(["You sell", qtyStr(q2)+" "+sym]);
      rows.push(["Fee ("+feePct()+")", moneyFull(fee2)]);
      if(h) rows.push(["Profit on this sale", moneyFull(gross-fee2-costOf(lot ? [lot] : lotsOf(sym), q2))]);
    }
    rows.forEach(function(r){
      var k=el("div","kv"); k.appendChild(el("span",null,r[0])); k.appendChild(el("b",null,r[1])); sumWrap.appendChild(k);
    });
    var avail=el("div","kv");
    avail.appendChild(el("span",null, sheetCtx.side==="buy"?"Available cash":(lot?"Trade value":"Position value")));
    avail.appendChild(el("b",null, moneyFull(maxUsd)));
    sumWrap.appendChild(avail);
  }
}

function paintCoinSheet(){
  if(!sheetCtx||sheetCtx.kind!=="coin") return;
  var sym=sheetCtx.sym, n=sheetCtx.nodes;
  n.price.textContent = priceStr(S.prices[sym]);
  var d=dayChange(sym);
  n.chg.textContent = pctStr(d)+" today";
  n.chg.className = cls(d);
  /* one trade: its entry and rules. Several: their average entry only */
  var mine=lotsOf(sym), marks=[];
  var one = (sheetCtx.lot && lotById(sheetCtx.lot)) || (mine.length===1 ? mine[0] : null);
  if(one){
    marks.push({v:one.p, label:"entry", token:"--crt-text", dash:[5,4]});
    if(one.sl) marks.push({v:one.sl, label:"stop", token:"--crt-down", dash:[3,3]});
    if(one.tp) marks.push({v:one.tp, label:"target", token:"--crt-up", dash:[3,3]});
  } else if(mine.length){
    marks.push({v:position(sym).avg, label:"avg entry", token:"--crt-text", dash:[5,4]});
  }
  drawChart(n.canvas, S.hist[sym], d>=0, marks);
}

function drawChart(cv, hist, up, marks){
  var dpr = window.devicePixelRatio||1;
  var w = cv.clientWidth, hh = cv.clientHeight;
  if(!w||!hh) return;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(hh*dpr)){
    cv.width=Math.round(w*dpr); cv.height=Math.round(hh*dpr);
  }
  var g=cv.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,hh);
  var st=getComputedStyle(document.documentElement);
  var col = (up? st.getPropertyValue("--crt-up") : st.getPropertyValue("--crt-down")).trim() || "#7BE8B8";
  var line = st.getPropertyValue("--crt-grid").trim() || "rgba(158,216,255,.13)";
  var n=Math.min(180,hist.length), sl=hist.slice(hist.length-n);
  var mn=Math.min.apply(null,sl), mx=Math.max.apply(null,sl);
  /* widen the window so an entry or a stop sitting outside the visible range
     is still on screen, which is exactly when you need to see it */
  marks = (marks||[]).filter(function(m){ return m && m.v>0; });
  marks.forEach(function(m){ if(m.v<mn) mn=m.v; if(m.v>mx) mx=m.v; });
  var rg=(mx-mn)||1;
  mn-=rg*0.06; mx+=rg*0.06; rg=mx-mn;
  var pad=12;
  g.strokeStyle=line; g.lineWidth=1;
  for(var i=1;i<4;i++){
    var y=pad+(hh-pad*2)*i/4;
    g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
  }
  function X(i){ return (i/(sl.length-1||1))*w; }
  function Y(v){ return pad+(hh-pad*2)*(1-(v-mn)/rg); }
  g.beginPath(); g.moveTo(X(0),Y(sl[0]));
  for(var j=1;j<sl.length;j++) g.lineTo(X(j),Y(sl[j]));
  g.strokeStyle=col; g.lineWidth=2; g.lineJoin="round"; g.stroke();
  g.lineTo(w,hh); g.lineTo(0,hh); g.closePath();
  var grad=g.createLinearGradient(0,0,0,hh);
  grad.addColorStop(0, hexA(col,0.24)); grad.addColorStop(1, hexA(col,0));
  g.fillStyle=grad; g.fill();
  g.fillStyle=st.getPropertyValue("--crt-text").trim()||"#9ED8FF";
  g.globalAlpha=0.75;
  g.font="600 10.5px Saira, sans-serif";
  g.fillText(priceStr(mx), 6, 11);
  g.fillText(priceStr(mn), 6, hh-4);
  g.globalAlpha=1;

  marks.forEach(function(m){
    var y=Y(m.v);
    if(y<6||y>hh-6) return;
    var mc=(st.getPropertyValue(m.token).trim())||"#888";
    g.save();
    g.setLineDash(m.dash||[4,4]);
    g.strokeStyle=mc; g.lineWidth=1.4;
    g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
    g.setLineDash([]);
    var text=m.label+" "+priceStr(m.v);
    g.font="700 10.5px Saira, sans-serif";
    var tw=g.measureText(text).width;
    g.fillStyle=(st.getPropertyValue("--crt").trim())||"#0F2A4D";
    g.fillRect(w-tw-10, y-11, tw+8, 13);
    g.fillStyle=mc;
    g.fillText(text, w-tw-6, y-1);
    g.restore();
  });
}
function hexA(hex,a){
  hex=hex.trim();
  if(hex[0]!=="#") return "rgba(80,160,140,"+a+")";
  if(hex.length===4) hex="#"+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3];
  var r=parseInt(hex.slice(1,3),16),g2=parseInt(hex.slice(3,5),16),b2=parseInt(hex.slice(5,7),16);
  return "rgba("+r+","+g2+","+b2+","+a+")";
}

/* ============================ first run ============================ */
var INTRO = [
  {
    t:"You have $3,000 of play money",
    p:["Prices follow the real market, pulled live from Binance or CoinGecko. Your trades never touch an exchange, nothing costs real money, and there are no ads or accounts.",
       "If the live feed is unreachable, or you pick the simulated market in Settings, a simulation on your device takes over. There a game day is about four minutes, so an hour covers roughly fifteen days of market."]
  },
  {
    t:"The coins do not carry equal risk",
    p:["Each one is tuned to its real-world volatility, so the same dollar in each is not the same bet. That is the main thing worth taking away from a game like this."],
    table:true
  },
  {
    t:"Decide your exit before you need it",
    p:["Tap any coin to trade. On a position you hold you can set a stop loss and a take profit as a percent from your entry, and the game closes it for you when the price gets there.",
       "A third of a game day after every sale, the Wallet tab tells you what the price did next. Selling early and selling well look identical at the moment you press the button."]
  }
];

function introSeen(){ try{ return localStorage.getItem("pw.intro")==="1"; }catch(e){ return true; } }
function markIntro(){ try{ localStorage.setItem("pw.intro","1"); }catch(e){} }

function renderIntro(i){
  i = i||0;
  sheetCtx={kind:"intro", step:i};
  var st=INTRO[i], b=$("#sheetBody"); b.textContent="";

  var head=el("div","sheeth");
  var nm=el("div","nm");
  nm.appendChild(el("b",null,st.t));
  nm.appendChild(el("small",null,"Step "+(i+1)+" of "+INTRO.length));
  head.appendChild(nm); b.appendChild(head);

  st.p.forEach(function(txt){
    var pp=el("p","note",txt); pp.style.margin="0 0 10px"; b.appendChild(pp);
  });

  if(st.table){
    var box=el("div","card"); box.style.padding="4px 13px 8px";
    COINS.forEach(function(c){
      var k=el("div","kv");
      k.appendChild(el("span",null,c.n));
      k.appendChild(el("b",null,"\u00B1"+(c.dv*100).toFixed(1)+"% a day"));
      box.appendChild(k);
    });
    b.appendChild(box);
  }

  var go=el("button","btn", i===INTRO.length-1 ? "Start trading" : "Next");
  go.style.marginTop="16px";
  go.addEventListener("click",function(){
    if(i===INTRO.length-1){ markIntro(); closeSheet(); }
    else renderIntro(i+1);
  });
  b.appendChild(go);

  if(i>0){
    var back=el("button","btn ghost","Back"); back.style.marginTop="8px";
    back.addEventListener("click",function(){ renderIntro(i-1); });
    b.appendChild(back);
  } else {
    var skip=el("button","btn ghost","Skip"); skip.style.marginTop="8px";
    skip.addEventListener("click",function(){ markIntro(); closeSheet(); });
    b.appendChild(skip);
  }
  openSheet();
}

/* ============================ settings ============================ */
function renderSettings(){
  sheetCtx={kind:"settings"};
  var b=$("#sheetBody"); b.textContent="";
  var head=el("div","sheeth"); head.appendChild(el("b",null,"Settings")); b.appendChild(head);

  b.appendChild(el("h2","sec","Appearance"));
  var th=el("select","sel");
  [["system","Follow the system"],["dark","Always dark"],["light","Always light"]].forEach(function(o){
    var op=el("option",null,o[1]); op.value=o[0]; th.appendChild(op);
  });
  var cur="system"; try{ cur=localStorage.getItem("pw.theme")||"system"; }catch(e){}
  th.value=cur;
  th.addEventListener("change",function(){
    if(th.value==="system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme",th.value);
    try{ localStorage.setItem("pw.theme",th.value); }catch(e){}
    paint({});
  });
  b.appendChild(th);

  b.appendChild(el("h2","sec","Prices"));
  var ps=el("select","sel");
  [["sim","Simulated market"],
   ["live:binance","Live prices from Binance"],
   ["live:gecko","Live prices from CoinGecko"]].forEach(function(o){
    var op=el("option",null,o[1]); op.value=o[0]; ps.appendChild(op);
  });
  ps.value = Feed.mode==="live" ? ("live:"+Feed.provider) : "sim";
  var pstat=el("p","note"); pstat.style.margin="7px 0 0";
  function refreshStat(){ pstat.textContent = Feed.label(); }
  refreshStat();
  ps.addEventListener("change",function(){
    var v=ps.value.split(":");
    Feed.set(v[0]==="live"?"live":"sim", v[1]);
    setTimeout(refreshStat,120); setTimeout(refreshStat,1200);
  });
  b.appendChild(ps); b.appendChild(pstat);
  var pnote=el("p","note");
  pnote.style.margin="7px 0 0";
  pnote.textContent="Live prices need a build that can reach the network, so the packaged app or your own hosting. They will not load inside a published artifact, where outbound requests are blocked. When a live feed is on, the simulator keeps the chart moving between polls and news shocks are switched off.";
  b.appendChild(pnote);

  b.appendChild(el("h2","sec","Trading fee"));
  var fs=el("select","sel");
  FEE_CHOICES.forEach(function(o){
    var op=el("option",null,o[1]); op.value=String(o[0]); fs.appendChild(op);
  });
  fs.value=String(S.fee);
  fs.addEventListener("change",function(){ S.fee=parseFloat(fs.value); save(); toast("Trading fee set to "+feePct()); });
  b.appendChild(fs);
  var fnote=el("p","note"); fnote.style.margin="7px 0 0";
  fnote.textContent="Charged on every buy and sell, as a share of its value. Large exchanges charge about 0.10% on small accounts.";
  b.appendChild(fnote);

  b.appendChild(el("h2","sec","Market speed"));
  var sp=el("select","sel");
  [[1,"Normal, one tick a second"],[2,"Fast, two ticks a second"],[4,"Very fast, four ticks a second"],[0,"Paused"]].forEach(function(o){
    var op=el("option",null,o[1]); op.value=String(o[0]); sp.appendChild(op);
  });
  sp.value=String(S.speed);
  sp.addEventListener("change",function(){ S.speed=parseInt(sp.value,10); startClock(); save(); });
  b.appendChild(sp);

  b.appendChild(el("h2","sec","Move your save"));
  var ta=el("textarea","io"); ta.readOnly=false; ta.value="";
  var row=el("div"); row.style.cssText="display:flex;gap:8px;margin-top:8px";
  var ex=el("button","btn ghost","Copy save out");
  ex.addEventListener("click",function(){
    ta.value=JSON.stringify(S);
    ta.select();
    try{ navigator.clipboard.writeText(ta.value); toast("Save copied to the clipboard"); }
    catch(e){ toast("Save is in the box, copy it manually"); }
  });
  var im=el("button","btn ghost","Load save in");
  im.addEventListener("click",function(){
    try{
      var o=JSON.parse(ta.value);
      if(!o||o.v!==1) throw new Error("bad");
      localStorage.setItem(SAVE_KEY, JSON.stringify(o));
      S=load()||freshState();
      closeSheet(); render(); toast("Save loaded");
    }catch(e){ toast("That does not look like a Shallow Whale save"); }
  });
  row.appendChild(ex); row.appendChild(im);
  b.appendChild(ta); b.appendChild(row);

  b.appendChild(el("h2","sec","How this works"));
  var again=el("button","btn ghost","Show the intro again");
  again.addEventListener("click",function(){ renderIntro(0); });
  b.appendChild(again);

  b.appendChild(el("h2","sec","Start over"));
  var rs=el("button","btn danger","Reset everything");
  var armed=false;
  rs.addEventListener("click",function(){
    if(!armed){ armed=true; rs.textContent="Tap again to wipe your progress"; setTimeout(function(){ armed=false; rs.textContent="Reset everything"; },4000); return; }
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    try{ localStorage.removeItem("pw.intro"); }catch(e){}
    S=freshState(); save(); closeSheet(); go("market"); toast("Fresh start, "+money(S.cash)+" in cash");
  });
  b.appendChild(rs);

  var ver=el("p","note","Shallow Whale "+APP_VERSION); ver.id="appVersion"; ver.style.margin="14px 0 0";
  b.appendChild(ver);

  b.appendChild(el("h2","sec","About"));
  var p1=el("p","note","Shallow Whale is a trading game. Live prices come from Binance or CoinGecko; the simulated market runs on your device. Your trades never touch an exchange and nothing here uses real money. There are no ads, no purchases and no accounts.");
  var p2=el("p","note","In the simulated market, one game day is 240 ticks, so about four minutes at normal speed. Your progress is saved on this device only.");
  b.appendChild(p1); b.appendChild(p2);
  var pp=el("a","attrib","Privacy policy");
  pp.href=PRIVACY_URL; pp.target="_blank"; pp.rel="noopener"; pp.id="privacyLink";
  b.appendChild(pp);

  var cl=el("button","btn ghost","Close"); cl.style.marginTop="12px";
  cl.addEventListener("click", closeSheet); b.appendChild(cl);
  openSheet();
}
$("#btnSettings").addEventListener("click", renderSettings);

/* ============================ clock ============================ */
function startClock(){
  if(timer) clearInterval(timer);
  if(!S.speed) return;
  timer=setInterval(step, Math.round(1000/S.speed));
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){ if(timer) clearInterval(timer); timer=null; Feed.stop(); save(); }
  else { startClock(); Feed.start(); }
});
window.addEventListener("resize",function(){ if(sheetCtx&&sheetCtx.kind==="coin") paintCoinSheet(); });

/* ============================ boot ============================ */
Feed.load();
S = load() || freshState();
if(typeof S.speed!=="number") S.speed=1;
if(!Array.isArray(S.quests)) S.quests=[];
refreshQuests(S, false);
buildTabs();
render();
save();
startClock();
Feed.start();
checkQuests();
if(!introSeen()) renderIntro(0);

/* Android hardware back: close the sheet, then step back to Market, then exit.
   Guarded so it is simply absent in a plain browser. */
(function(){
  var cap = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if(!cap || !cap.addListener) return;
  cap.addListener("backButton", function(){
    if(sheetCtx){ closeSheet(); return; }
    if(tab!=="market"){ go("market"); return; }
    if(cap.exitApp) cap.exitApp();
  });
})();

})();
